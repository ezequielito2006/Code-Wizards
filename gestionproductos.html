<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos - Delizia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="img/delizia-logo.png" alt="Delizia Helados" />
    </div>
    <nav class="nav-links">
      <ul>
        <li><a href="adminPanel.html">Panel Principal</a></li>
        <li><a href="admin-usuarios.html">Usuarios</a></li>
        <li><a href="gestionproductos.html">Productos</a></li>
      </ul>
    </nav>
  </header>

  <main class="admin-main">
    <section class="panel-productos">
      <h2>Gestión de Productos</h2>

      <form id="form-producto" class="formulario">
        <input type="text" name="nombre" placeholder="Nombre del producto" required />
        <textarea name="descripcion" placeholder="Descripción"></textarea>
        <input type="number" name="precio" placeholder="Precio" required />
        <input type="number" name="stock" placeholder="Stock inicial" required />
        <input type="text" name="categoria" placeholder="Categoría" />
         <input type="file" name="imagen" accept="image/*" required />
        <button type="submit">Crear producto</button>
      </form>

      <table id="tabla-productos">
        <thead>
          <tr>
            <th>ID</th>
             <th>Imagen</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Categoría</th>
            <th>Activo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
  <!-- Modal de edición de producto -->
<div id="modal-editar-producto" class="modal-edicion" style="display:none;">
  <div class="modal-edicion-contenido">
    <span class="cerrar-modal" onclick="cerrarModal()">✖</span>
    <form id="formEditarProducto">
      <h2>Editar Producto</h2>

      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion"></textarea>

      <label for="precio">Precio (Bs):</label>
      <input type="number" id="precio" name="precio" min="0" step="0.01" required>

      <label for="stock">Stock:</label>
      <input type="number" id="stock" name="stock" min="0" required>

      <label for="categoria">Categoría:</label>
      <input type="text" id="categoria" name="categoria">

      <label for="activo">Estado:</label>
      <select id="activo" name="activo">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>

      <div class="botones-form">
        <button type="submit" class="btn guardar">Guardar</button>
        <button type="button" class="btn cancelar" onclick="cerrarModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
